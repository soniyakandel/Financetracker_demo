<div style="margin:0;padding:24px 12px;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;">

    <div style="padding:20px 28px;border-bottom:1px solid #e2e8f0;">
      <span style="font-size:17px;font-weight:600;color:#0f172a;">&#8355; Finance<strong>Tracker</strong></span>
    </div>

    <div style="padding:28px;">
      <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;color:#0f172a;">{% block email_title %}{% endblock %}</h1>
      {% block email_body %}{% endblock %}
    </div>

    <div style="padding:18px 28px;background:#f8fafc;border-top:1px solid #e2e8f0;">
      <p style="margin:0;font-size:12px;line-height:1.6;color:#64748b;">
        This is an automated message from Finance Tracker, so please do not
        reply to it. If you were not expecting this email you can ignore it,
        and you should change your password if you did not ask for it.
      </p>
    </div>

  </div>
</div>
